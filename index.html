<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gemini Voice & Text Transcribe Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1' } }
                }
            }
        }
    </script>
    <style>
        .tab-active { border-bottom: 2px solid #0284c7; color: #0284c7; background-color: #f8fafc; }
        .tab-inactive { border-bottom: 2px solid transparent; color: #64748b; }
        .tab-inactive:hover { color: #334155; }
        .toast { transition: all 0.3s ease-in-out; transform: translateX(120%); opacity: 0; }
        .toast.show { transform: translateX(0); opacity: 1; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans text-slate-800">

    <div id="toast-container" class="fixed top-5 right-5 z-[9999] flex flex-col gap-3"></div>

    <nav class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-brand-600 rounded-xl flex items-center justify-center text-white shadow-md">
                    <i class="fas fa-microphone-lines text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-800 leading-tight">AI 語音與翻譯中心</h1>
                    <p class="text-[11px] text-slate-500">Gemini Pro 企業級解決方案</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="toggleApiKeyModal()" class="flex items-center gap-2 px-3 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm font-medium transition-colors relative">
                    <i class="fas fa-key text-slate-600"></i>
                    <span class="hidden sm:inline">API 設定</span>
                    <div id="api-status-indicator" class="w-2.5 h-2.5 rounded-full bg-red-500 absolute -top-1 -right-1 border-2 border-white"></div>
                </button>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 flex flex-col gap-6">
        
        <!-- Tab Navigation -->
        <div class="flex bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <button id="tab-btn-stt" onclick="switchTab('stt')" class="flex-1 py-3.5 text-sm font-bold tab-active transition-colors flex justify-center items-center gap-2">
                <i class="fas fa-wave-square"></i> 語音轉錄 (STT)
            </button>
            <button id="tab-btn-translate" onclick="switchTab('translate')" class="flex-1 py-3.5 text-sm font-bold tab-inactive transition-colors flex justify-center items-center gap-2">
                <i class="fas fa-language"></i> 智慧文字翻譯
            </button>
        </div>

        <!-- Tab 1: STT Section -->
        <section id="tab-stt" class="block space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-base font-bold mb-4 flex items-center gap-2"><i class="fas fa-cloud-upload-alt text-brand-600"></i> 音訊輸入</h2>
                
                <div id="upload-zone" class="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center hover:border-brand-500 hover:bg-brand-50 transition-all cursor-pointer relative group">
                    <input type="file" id="file-upload" class="hidden" accept="audio/*,video/*">
                    <div id="upload-icon-container" class="w-16 h-16 mx-auto bg-slate-100 group-hover:bg-brand-100 text-slate-400 group-hover:text-brand-600 rounded-full flex items-center justify-center text-2xl mb-3 transition-colors">
                        <i class="fas fa-file-audio"></i>
                    </div>
                    <p class="text-slate-600 font-medium mb-1">點擊上傳，或將音檔拖曳至此</p>
                    <p class="text-xs text-slate-400">支援 MP3, WAV, M4A, MP4 (最大上限 20MB)</p>
                    <p id="selected-file-info" class="hidden mt-3 text-sm font-bold text-brand-600 bg-brand-50 inline-block px-3 py-1 rounded-lg"></p>
                </div>

                <div class="flex items-center gap-4 mt-4">
                    <div class="flex-1 h-px bg-slate-200"></div>
                    <span class="text-xs text-slate-400 font-bold uppercase tracking-wider">OR</span>
                    <div class="flex-1 h-px bg-slate-200"></div>
                </div>

                <div class="mt-4 flex justify-center" id="btn-record-container">
                    <button id="btn-record" class="flex items-center gap-2 px-6 py-3 bg-slate-800 hover:bg-slate-900 text-white rounded-full font-bold shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5">
                        <i class="fas fa-microphone"></i> 啟用麥克風錄音
                    </button>
                </div>
                
                <div id="recording-indicator" class="hidden mt-4 justify-center items-center gap-4 bg-red-50 border border-red-100 p-4 rounded-xl">
                    <div class="flex items-center gap-3 text-red-600 font-bold">
                        <span class="relative flex h-3 w-3"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span></span>
                        錄音中... <span id="record-time" class="font-mono ml-1">00:00</span>
                    </div>
                    <button id="btn-stop-record" class="px-4 py-1.5 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm font-bold shadow-sm transition-colors">停止並完成</button>
                </div>

                <div id="audio-playback-container" class="hidden mt-6 bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <p class="text-xs font-bold text-slate-500 mb-2">音訊預覽</p>
                    <audio id="audio-playback" controls class="w-full h-10"></audio>
                </div>
            </div>

            <!-- Options & Process Button -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex flex-wrap gap-4 mb-5">
                    <label class="flex items-center gap-2 cursor-pointer text-sm font-medium"><input type="checkbox" id="chk-auto-translate" class="w-4 h-4 text-brand-600 rounded focus:ring-brand-500"> 轉錄後自動翻譯繁中</label>
                    <label class="flex items-center gap-2 cursor-pointer text-sm font-medium"><input type="checkbox" id="chk-srt" class="w-4 h-4 text-brand-600 rounded focus:ring-brand-500"> 產出 SRT 字幕格式</label>
                    <label class="flex items-center gap-2 cursor-pointer text-sm font-medium"><input type="checkbox" id="chk-diarization" class="w-4 h-4 text-brand-600 rounded focus:ring-brand-500"> 標記對話講者</label>
                </div>
                <div class="mb-5">
                    <input type="text" id="custom-vocab" placeholder="自訂優先詞庫 (例如：特定人名、專有名詞，以逗號分隔)" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
                </div>
                <button id="btn-process-audio" disabled class="w-full py-3.5 bg-brand-600 hover:bg-brand-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white rounded-xl font-bold shadow-md transition-colors flex items-center justify-center gap-2">
                    <i class="fas fa-magic"></i> 開始 AI 處理
                </button>
            </div>

            <!-- Results -->
            <div id="stt-output-section" class="hidden space-y-4">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 relative">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-slate-700 flex items-center gap-2"><i class="fas fa-file-alt text-brand-500"></i> 原文逐字稿 <span id="label-srt-active" class="hidden text-[10px] bg-purple-100 text-purple-700 px-2 py-0.5 rounded font-bold">SRT 模式</span></h3>
                        <div class="flex gap-2">
                            <button onclick="copyToClipboard('stt-source-text')" class="text-slate-400 hover:text-brand-600 transition-colors p-1" title="複製"><i class="far fa-copy"></i></button>
                            <button id="btn-export-srt" onclick="exportToSRT()" class="hidden text-slate-400 hover:text-purple-600 transition-colors p-1" title="下載 SRT"><i class="fas fa-download"></i></button>
                        </div>
                    </div>
                    <textarea id="stt-source-text" readonly class="w-full h-40 p-4 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-700 focus:outline-none resize-y"></textarea>
                </div>

                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-slate-700 flex items-center gap-2"><i class="fas fa-language text-green-500"></i> 翻譯結果</h3>
                        <button onclick="copyToClipboard('stt-translated-text')" class="text-slate-400 hover:text-brand-600 transition-colors p-1"><i class="far fa-copy"></i></button>
                    </div>
                    <textarea id="stt-translated-text" readonly class="w-full h-32 p-4 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-700 focus:outline-none resize-y"></textarea>
                </div>

                <!-- AI Smart Assistant -->
                <div class="bg-slate-800 p-5 rounded-2xl shadow-md border border-slate-700">
                    <h3 class="font-bold text-white mb-3 flex items-center gap-2"><i class="fas fa-robot text-brand-400"></i> AI 智慧助手</h3>
                    <div class="flex flex-wrap gap-2 mb-4">
                        <button onclick="runAIAssistant('summary')" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium transition-colors border border-slate-600">📝 重點摘要</button>
                        <button onclick="runAIAssistant('action')" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium transition-colors border border-slate-600">✅ 待辦事項</button>
                        <button onclick="runAIAssistant('grammar')" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium transition-colors border border-slate-600">✨ 文法潤飾</button>
                    </div>
                    
                    <div id="ai-assistant-loading" class="hidden items-center justify-center gap-3 py-6">
                        <i class="fas fa-circle-notch fa-spin text-brand-400 text-2xl"></i>
                        <span id="ai-assistant-loading-text" class="text-slate-300 text-sm font-medium">AI 分析中...</span>
                    </div>
                    
                    <div class="relative">
                        <textarea id="ai-assistant-output" readonly class="w-full h-40 p-4 bg-slate-900 border border-slate-600 rounded-xl text-sm text-slate-300 focus:outline-none resize-y placeholder-slate-600" placeholder="點擊上方按鈕生成 AI 分析..."></textarea>
                        <div class="absolute top-3 right-3 flex gap-2">
                            <button onclick="copyToClipboard('ai-assistant-output')" class="w-8 h-8 rounded-lg bg-slate-700 text-slate-300 hover:text-white hover:bg-slate-600 flex items-center justify-center transition-colors shadow-sm" title="複製內容"><i class="far fa-copy text-sm"></i></button>
                            <button onclick="exportToWord('ai')" class="w-8 h-8 rounded-lg bg-blue-600/30 text-blue-400 hover:text-white hover:bg-blue-600 flex items-center justify-center transition-colors shadow-sm border border-blue-500/50" title="匯出 Word"><i class="fas fa-file-word text-sm"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Tab 2: Text Translation Section -->
        <section id="tab-translate" class="hidden flex-col gap-6">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex flex-col sm:flex-row gap-4 mb-4">
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-slate-500 mb-1">目標語言</label>
                        <!-- 完整 11 國語言選單 -->
                        <select id="translation-target-lang" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none">
                            <option value="繁體中文">繁體中文 (Traditional Chinese)</option>
                            <option value="簡體中文">簡體中文 (Simplified Chinese)</option>
                            <option value="English">English</option>
                            <option value="日本語">日本語 (Japanese)</option>
                            <option value="한국어">한국어 (Korean)</option>
                            <option value="Español">Español (Spanish)</option>
                            <option value="德語">德語 (German)</option>
                            <option value="法語">法語 (French)</option>
                            <option value="ภาษาไทย">ภาษาไทย (Thai)</option>
                            <option value="Bahasa Indonesia">Bahasa Indonesia (Indonesian)</option>
                            <option value="Tiếng Việt">Tiếng Việt (Vietnamese)</option>
                        </select>
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-slate-500 mb-1">語氣與風格</label>
                        <select id="translation-tone" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none">
                            <option value="professional and polite">專業與禮貌</option>
                            <option value="casual and friendly">輕鬆與友善</option>
                            <option value="academic and formal">學術與正式</option>
                            <option value="creative and engaging">創意與吸引人</option>
                        </select>
                    </div>
                </div>
                
                <h3 class="font-bold text-slate-700 mb-2 flex items-center gap-2"><i class="fas fa-keyboard text-brand-500"></i> 輸入原文</h3>
                <textarea id="text-input" class="w-full h-40 p-4 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-700 focus:outline-none focus:border-brand-500 resize-y transition-colors" placeholder="請在此輸入要翻譯的文字..."></textarea>
                
                <button id="btn-translate-text" class="w-full mt-4 py-3 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-bold shadow-md transition-colors flex items-center justify-center gap-2">
                    <i class="fas fa-language text-lg"></i> 開始智慧翻譯
                </button>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 relative">
                <div id="translation-loading" class="hidden absolute inset-0 bg-white/80 backdrop-blur-sm z-10 rounded-2xl items-center justify-center">
                    <div class="flex items-center gap-3 bg-white px-5 py-3 rounded-full shadow-lg border border-slate-100">
                        <i class="fas fa-spinner fa-spin text-brand-600 text-xl"></i>
                        <span class="text-sm font-bold text-slate-700">AI 翻譯中...</span>
                    </div>
                </div>
                
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-slate-700 flex items-center gap-2"><i class="fas fa-check-circle text-green-500"></i> 翻譯結果</h3>
                    <div class="flex gap-2">
                        <button id="btn-play-audio" class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-100 hover:bg-brand-50 text-slate-600 hover:text-brand-600 rounded-lg text-xs font-bold transition-colors border border-slate-200">
                            <i class="fas fa-volume-up"></i> 朗讀
                        </button>
                        <button onclick="copyToClipboard('text-output')" class="w-8 h-8 rounded-lg bg-slate-50 hover:bg-slate-100 text-slate-400 hover:text-brand-600 flex items-center justify-center transition-colors border border-slate-200" title="複製"><i class="far fa-copy text-sm"></i></button>
                    </div>
                </div>
                <textarea id="text-output" readonly class="w-full h-48 p-4 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none resize-y"></textarea>
            </div>
        </section>
    </main>

    <!-- API Key Modal -->
    <div id="modal-apikey" class="hidden fixed inset-0 z-[99999] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div id="modal-apikey-content" class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden scale-95 transition-transform duration-300">
            <div class="bg-slate-50 px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                <h3 class="font-bold text-slate-800 flex items-center gap-2"><i class="fas fa-key text-brand-600"></i> API 金鑰設定</h3>
                <button onclick="toggleApiKeyModal()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times text-lg"></i></button>
            </div>
            <div class="p-6">
                <p class="text-sm text-slate-500 mb-4">請輸入您的 Google Gemini API Key。金鑰僅儲存於您的瀏覽器本地端，不會回傳至我們的伺服器。</p>
                <input type="password" id="input-api-key" placeholder="AIzaSy..." class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 outline-none mb-4 font-mono">
                <button onclick="saveApiKey()" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-bold shadow-md transition-colors">驗證並儲存</button>
            </div>
        </div>
    </div>

    <script>
        // 捕捉全域錯誤
        window.onerror = function(msg, url, line) { 
            console.error(msg, url, line);
            // showToast(`系統警告: ${msg}`, 'error'); // 關閉不必要的底層警告以防干擾
        };

        // 狀態變數
        let currentApiKey = localStorage.getItem('gemini_api_key') || '';
        let mediaRecorder; 
        let audioChunks = []; 
        let audioBlob = null; 
        let audioBase64 = null;
        let isRecording = false; 
        let recordTimerInterval; 
        let recordSeconds = 0;

        // 初始化
        document.addEventListener('DOMContentLoaded', () => { 
            updateApiKeyUI();
            
            // 安全綁定點擊與變更事件
            document.getElementById('btn-translate-text')?.addEventListener('click', processTextTranslation);
            document.getElementById('btn-record')?.addEventListener('click', startRecording);
            document.getElementById('btn-stop-record')?.addEventListener('click', stopRecording);
            document.getElementById('btn-process-audio')?.addEventListener('click', processAudioWithGemini);
            document.getElementById('btn-play-audio')?.addEventListener('click', playTranslatedAudio);
            
            // 檔案上傳綁定
            const fileUploadEl = document.getElementById('file-upload');
            if (fileUploadEl) {
                fileUploadEl.addEventListener('change', handleFileUpload);
            }
            // 點擊區域觸發檔案上傳
            const uploadZoneEl = document.getElementById('upload-zone');
            if (uploadZoneEl && fileUploadEl) {
                uploadZoneEl.addEventListener('click', (e) => {
                    // 避免重複觸發
                    if(e.target !== fileUploadEl) {
                        fileUploadEl.click();
                    }
                });
            }

            // 拖曳上傳防護與綁定
            const dropZone = document.getElementById('upload-zone');
            const uploadIcon = document.getElementById('upload-icon-container');
            if(dropZone) {
                ['dragenter', 'dragover'].forEach(e => dropZone.addEventListener(e, ev => { 
                    ev.preventDefault(); 
                    ev.stopPropagation();
                    dropZone.classList.add('border-brand-500', 'bg-brand-50'); 
                    uploadIcon?.classList.add('bg-brand-100', 'text-brand-600'); 
                }));
                ['dragleave', 'drop'].forEach(e => dropZone.addEventListener(e, ev => { 
                    ev.preventDefault(); 
                    ev.stopPropagation();
                    dropZone.classList.remove('border-brand-500', 'bg-brand-50'); 
                    uploadIcon?.classList.remove('bg-brand-100', 'text-brand-600'); 
                }));
                dropZone.addEventListener('drop', async (ev) => {
                    if (ev.dataTransfer.files.length > 0) processSelectedFile(ev.dataTransfer.files[0]);
                });
            }
        });

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container'); 
            if(!container) return;
            const toast = document.createElement('div');
            const icon = type === 'success' ? 'fa-check-circle text-green-500' : type === 'error' ? 'fa-exclamation-circle text-red-500' : 'fa-info-circle text-brand-500';
            toast.className = `toast bg-white px-4 py-3 rounded-lg shadow-lg border-l-4 ${type === 'success' ? 'border-green-500' : type === 'error' ? 'border-red-500' : 'border-brand-500'} flex items-center gap-3 min-w-[250px]`; 
            toast.innerHTML = `<i class="fas ${icon} text-lg"></i><span class="text-sm font-medium text-slate-700">${message}</span>`;
            container.appendChild(toast); 
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3500);
        }

        function switchTab(tab) {
            const btnStt = document.getElementById('tab-btn-stt'); 
            const btnTrans = document.getElementById('tab-btn-translate');
            const tStt = document.getElementById('tab-stt'); 
            const tTrans = document.getElementById('tab-translate');
            if (tab === 'stt') {
                btnStt.className = 'flex-1 py-3.5 text-sm font-bold tab-active transition-colors flex justify-center items-center gap-2'; 
                btnTrans.className = 'flex-1 py-3.5 text-sm font-bold tab-inactive transition-colors flex justify-center items-center gap-2';
                tStt.style.display = 'block'; tTrans.style.display = 'none';
            } else {
                btnTrans.className = 'flex-1 py-3.5 text-sm font-bold tab-active transition-colors flex justify-center items-center gap-2'; 
                btnStt.className = 'flex-1 py-3.5 text-sm font-bold tab-inactive transition-colors flex justify-center items-center gap-2';
                tTrans.style.display = 'flex'; tStt.style.display = 'none';
            }
        }

        function toggleApiKeyModal() {
            const m = document.getElementById('modal-apikey'); 
            const c = document.getElementById('modal-apikey-content');
            if (m.classList.contains('hidden')) { 
                document.getElementById('input-api-key').value = currentApiKey; 
                m.classList.remove('hidden'); 
                setTimeout(() => { m.classList.remove('opacity-0'); c.classList.remove('scale-95'); }, 10); 
            } else { 
                m.classList.add('opacity-0'); c.classList.add('scale-95'); 
                setTimeout(() => m.classList.add('hidden'), 300); 
            }
        }

        function copyToClipboard(id) {
            const t = document.getElementById(id)?.value; 
            if(!t) return showToast('無內容可複製', 'warning');
            const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); showToast('已複製到剪貼簿', 'success'); } 
            catch (e) { showToast('複製失敗', 'error'); } 
            document.body.removeChild(ta);
        }

        async function saveApiKey() {
            const key = document.getElementById('input-api-key').value.trim(); 
            if (!key) return showToast('請輸入金鑰', 'error');
            const btn = document.querySelector('#modal-apikey-content button'); 
            const orig = btn.innerHTML; 
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1.5"></i>驗證中...'; btn.disabled = true;
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent?key=${key}`, { 
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ contents: [{ parts: [{ text: "Hi" }] }] }) 
                });
                if (res.ok) { 
                    currentApiKey = key; localStorage.setItem('gemini_api_key', key); 
                    updateApiKeyUI(); showToast('金鑰設定成功', 'success'); toggleApiKeyModal(); 
                } else showToast('無效的金鑰', 'error');
            } catch (e) { showToast('網路錯誤', 'error'); } 
            finally { btn.innerHTML = orig; btn.disabled = false; }
        }

        function updateApiKeyUI() {
            const ind = document.getElementById('api-status-indicator');
            if(ind) ind.className = currentApiKey ? "w-2.5 h-2.5 rounded-full bg-green-500 absolute -top-1 -right-1 border-2 border-white shadow-[0_0_8px_rgba(34,197,94,0.6)]" : "w-2.5 h-2.5 rounded-full bg-red-500 absolute -top-1 -right-1 border-2 border-white shadow-[0_0_8px_rgba(239,68,68,0.6)]";
        }

        async function handleFileUpload(e) {
            if (e.target.files.length > 0) processSelectedFile(e.target.files[0]);
        }
        
        async function processSelectedFile(file) {
            try {
                audioBlob = file; 
                await prepareAudioForGemini();
                document.getElementById('audio-playback').src = URL.createObjectURL(audioBlob); 
                document.getElementById('audio-playback-container').classList.remove('hidden');
                const fi = document.getElementById('selected-file-info'); 
                fi.textContent = `${audioBlob.name} (${(audioBlob.size/1024/1024).toFixed(2)} MB)`; 
                fi.classList.remove('hidden');
                const b = document.getElementById('btn-process-audio'); 
                b.classList.remove('opacity-50', 'cursor-not-allowed'); b.disabled = false;
                showToast('音檔載入就緒', 'success');
            } catch (err) { showToast('音檔讀取失敗', 'error'); }
        }

        async function prepareAudioForGemini() { 
            return new Promise((res) => { 
                const r = new FileReader(); 
                r.readAsDataURL(audioBlob); 
                r.onloadend = () => { audioBase64 = r.result.split(',')[1]; res(); } 
            }); 
        }

        async function startRecording() {
            try {
                // 安全防護：如果瀏覽器連媒體設備都沒有，直接報錯
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    showToast('環境阻擋：請使用原生瀏覽器 (非 Line 內建) 或確認 HTTPS 加密連線', 'error');
                    return;
                }
                
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                let mt = 'audio/webm'; 
                if(!MediaRecorder.isTypeSupported(mt)) mt = 'audio/mp4'; 
                if(!MediaRecorder.isTypeSupported(mt)) mt = '';
                
                mediaRecorder = mt ? new MediaRecorder(stream, { mimeType: mt }) : new MediaRecorder(stream); 
                audioChunks = [];
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = async () => {
                    audioBlob = new Blob(audioChunks, { type: mt || 'audio/wav' }); 
                    await prepareAudioForGemini();
                    document.getElementById('audio-playback').src = URL.createObjectURL(audioBlob); 
                    document.getElementById('audio-playback-container').classList.remove('hidden');
                    const b = document.getElementById('btn-process-audio'); 
                    b.classList.remove('opacity-50', 'cursor-not-allowed'); b.disabled = false;
                };
                
                mediaRecorder.start(100); isRecording = true; recordSeconds = 0;
                document.getElementById('btn-record-container').classList.add('hidden'); 
                document.getElementById('recording-indicator').classList.remove('hidden');
                document.getElementById('recording-indicator').classList.add('flex');
                
                recordTimerInterval = setInterval(() => { 
                    recordSeconds++; 
                    document.getElementById('record-time').textContent = `${Math.floor(recordSeconds/60).toString().padStart(2,'0')}:${(recordSeconds%60).toString().padStart(2,'0')}`; 
                }, 1000);
            } catch (err) { 
                showToast(`麥克風權限失敗: ${err.message}`, 'error');
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop(); mediaRecorder.stream.getTracks().forEach(t => t.stop());
                isRecording = false; clearInterval(recordTimerInterval);
                document.getElementById('btn-record-container').classList.remove('hidden'); 
                document.getElementById('recording-indicator').classList.add('hidden');
                document.getElementById('recording-indicator').classList.remove('flex');
            }
        }

        async function processAudioWithGemini() {
            if (!currentApiKey) return showToast('請先設定 API Key', 'error'); 
            if (!audioBase64) return showToast('請先上傳音檔', 'warning');
            
            const btn = document.getElementById('btn-process-audio'); 
            const origHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>AI 處理中...'; 
            btn.disabled = true;

            const isAuto = document.getElementById('chk-auto-translate').checked; 
            const isSrt = document.getElementById('chk-srt').checked;
            const isDia = document.getElementById('chk-diarization').checked; 
            const vocab = document.getElementById('custom-vocab').value.trim();
            
            document.getElementById('stt-source-text').value = ""; 
            document.getElementById('stt-translated-text').value = "";
            document.getElementById('stt-output-section').classList.remove('hidden');
            
            try {
                let prompt = "請聆聽音檔並轉錄為文字。\n";
                if(isSrt && isDia) prompt += "【輸出】標準 SRT 字幕，並標記講者。\n";
                else if(isSrt) prompt += "【輸出】標準 SRT 字幕。\n";
                else if(isDia) prompt += "【輸出】逐字稿並標記講者。\n";
                if(vocab) prompt += `【優先詞庫】${vocab}\n`; 

                let mt = (audioBlob.type || "audio/mpeg").split(';')[0];
                if(mt === "audio/mp3") mt = "audio/mpeg"; 

                const payload = { 
                    contents: [{ role: "user", parts: [{ inlineData: { mimeType: mt, data: audioBase64 } }, { text: prompt }] }], 
                    generationConfig: { temperature: 0.2 } 
                };
                
                let srcTxt = "";
                try {
                    // 先用 3.5 Transcribe
                    const r35 = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-transcribe:generateContent?key=${currentApiKey}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    const res35 = await r35.json(); 
                    if (!r35.ok) throw new Error(res35.error?.message || '3.5 failed');
                    srcTxt = res35?.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!srcTxt || srcTxt.trim() === "") throw new Error("empty response");
                } catch (e) {
                    // 備援 3.7 Flash
                    showToast('啟動 3.7 Flash 備援機制', 'warning'); 
                    btn.innerHTML = '<i class="fas fa-bolt mr-2"></i>3.7 Flash 備援處理...';
                    const r37 = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent?key=${currentApiKey}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    const res37 = await r37.json(); 
                    if (!r37.ok) {
                        throw new Error(`[3.7 錯誤]: ${res37.error?.message || 'API 拒絕連線'}`);
                    }
                    srcTxt = res37?.candidates?.[0]?.content?.parts?.[0]?.text || "【未能辨識語音】"; 
                }

                document.getElementById('stt-source-text').value = srcTxt.trim();
                
                let transTxt = "未啟用同步翻譯";
                if (isAuto && !srcTxt.includes("【未能辨識")) {
                    btn.innerHTML = '<i class="fas fa-language fa-spin mr-2"></i>翻譯中...';
                    const tRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent?key=${currentApiKey}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: `翻譯為繁中(保留格式):\n\n${srcTxt}` }] }] }) });
                    if (tRes.ok) { const tr = await tRes.json(); transTxt = tr?.candidates?.[0]?.content?.parts?.[0]?.text || "翻譯失敗"; }
                }
                document.getElementById('stt-translated-text').value = transTxt.trim();
                
                if (isSrt) { document.getElementById('btn-export-srt').classList.remove('hidden'); document.getElementById('label-srt-active').classList.replace('hidden', 'inline-block'); }
                else { document.getElementById('btn-export-srt').classList.add('hidden'); document.getElementById('label-srt-active').classList.replace('inline-block', 'hidden'); }
                
                showToast('處理完成', 'success'); 
            } catch (err) {
                document.getElementById('stt-source-text').value = `【錯誤】\n${err.message}`; 
                showToast(`處理失敗: ${err.message}`, 'error');
            } finally { 
                btn.innerHTML = origHtml; btn.disabled = false; 
            }
        }

        async function runAIAssistant(type) {
            if(!currentApiKey) return showToast('請先設定 API 金鑰', 'error');
            const txt = document.getElementById('stt-source-text').value.trim(); 
            // 修正：拔除對中括號的錯誤攔截，讓備援的資料也能跑
            if(!txt || txt.includes('【錯誤】')) return showToast('無有效的逐字稿內容', 'warning');
            
            const l = document.getElementById('ai-assistant-loading'); 
            const o = document.getElementById('ai-assistant-output'); 
            const lt = document.getElementById('ai-assistant-loading-text');
            l.classList.remove('hidden'); l.classList.add('flex'); o.value = '';
            
            let p = ""; 
            if(type === 'summary') { lt.textContent='AI 正在整理重點摘要...'; p=`請整理重點摘要 (Bullet points):\n\n${txt}`; } 
            else if(type === 'action') { lt.textContent='AI 正在提取待辦事項...'; p=`請列出待辦事項 (Action Items):\n\n${txt}`; } 
            else { lt.textContent='AI 正在進行文法潤飾...'; p=`請潤飾以下文字，去除贅字使其流暢:\n\n${txt}`; }
            
            try {
                const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent?key=${currentApiKey}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: p }] }] }) });
                const j = await r.json(); o.value = j?.candidates?.[0]?.content?.parts?.[0]?.text || '生成失敗。'; 
                showToast('AI 分析完成', 'success');
            } catch(e) { o.value = '網路連線錯誤。'; } 
            finally { l.classList.replace('flex', 'hidden'); }
        }

        async function processTextTranslation() {
            if (!currentApiKey) return showToast('需設定 API Key', 'error');
            const txt = document.getElementById('text-input').value.trim(); 
            if (!txt) return showToast('請輸入文字', 'info');
            
            const tone = document.getElementById('translation-tone').value; 
            const tLang = document.getElementById('translation-target-lang').value;
            
            document.getElementById('translation-loading').classList.remove('hidden'); 
            document.getElementById('translation-loading').classList.add('flex');
            document.getElementById('text-output').value = "";
            
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent?key=${currentApiKey}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: `Translate to ${tLang}. Tone: "${tone}". Output ONLY translated text.\n\n${txt}` }] }] }) });
                const data = await res.json(); 
                if (!res.ok) throw new Error();
                document.getElementById('text-output').value = (data?.candidates?.[0]?.content?.parts?.[0]?.text || "錯誤").trim();
                showToast('翻譯完成', 'success');
            } catch (e) { 
                showToast('翻譯失敗', 'error'); 
            } finally { 
                document.getElementById('translation-loading').classList.replace('flex', 'hidden'); 
            }
        }

        // ==========================================
        // Gemini TTS 音訊解碼器 (PCM 轉 WAV 封裝)
        // ==========================================
        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        function pcmToWav(pcm16, sampleRate) {
            const numChannels = 1;
            const byteRate = sampleRate * numChannels * 2;
            const blockAlign = numChannels * 2;
            const dataSize = pcm16.length * 2;
            const buffer = new ArrayBuffer(44 + dataSize);
            const view = new DataView(buffer);
            
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + dataSize, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); // PCM
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, 16, true); // 16-bit
            writeString(view, 36, 'data');
            view.setUint32(40, dataSize, true);
            
            let offset = 44;
            for (let i = 0; i < pcm16.length; i++, offset += 2) {
                view.setInt16(offset, pcm16[i], true);
            }
            return new Blob([view], { type: 'audio/wav' });
        }

        function base64ToArrayBuffer(base64) {
            const binaryString = window.atob(base64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        // ==========================================
        // 官方 Gemini 2.5 TTS 雲端語音引擎
        // 完美解決跨網域 CORS 問題，支援全球語系
        // ==========================================
        window.playTranslatedAudio = async function() {
            if (!currentApiKey) return showToast('請先設定 API Key', 'error');
            const text = document.getElementById('text-output').value.trim();
            if (!text) return showToast('沒有可以朗讀的文字', 'warning');
            
            const btn = document.getElementById('btn-play-audio'); 
            const orig = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1.5"></i>API 準備中'; 
            btn.disabled = true;

            try {
                // 將長文切割避免單次 API 負載過大
                const chunks = text.match(/[^。！？.!?\n]+[。！？.!?\n]+/g) || [text];
                btn.innerHTML = '<i class="fas fa-volume-up text-brand-600 animate-pulse mr-1.5"></i>雲端朗讀中';
                
                for (let chunk of chunks) {
                    if (!chunk.trim()) continue;
                    
                    // 【關鍵破解】：在文字前方強制加上官方指定的前綴指令 "TTS the following text:"
                    // 這會強迫模型關閉問答功能，純粹將文字轉為音訊，且不會唸出這句指令。
                    const ttsPrompt = `TTS the following text:\n${chunk}`;
                    
                    const payload = {
                        contents: [{ parts: [{ text: ttsPrompt }] }],
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Aoede" } } } 
                        }
                    };

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${currentApiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(`${errorData.error?.message || '狀態碼 ' + response.status}`);
                    }
                    
                    const result = await response.json();
                    const part = result?.candidates?.[0]?.content?.parts?.[0];
                    if (!part?.inlineData?.data) throw new Error('模型未回傳音訊檔案');

                    // 解析 PCM 音訊資料並封裝成瀏覽器能播的 WAV 檔
                    const audioBase64 = part.inlineData.data;
                    const mimeType = part.inlineData.mimeType || "audio/pcm;rate=24000";
                    let sampleRate = 24000;
                    const rateMatch = mimeType.match(/rate=(\d+)/);
                    if (rateMatch) sampleRate = parseInt(rateMatch[1], 10);

                    const pcmData = base64ToArrayBuffer(audioBase64);
                    const pcm16 = new Int16Array(pcmData);
                    const wavBlob = pcmToWav(pcm16, sampleRate);
                    const audioUrl = URL.createObjectURL(wavBlob);
                    
                    const audio = new Audio(audioUrl);
                    await new Promise((res, rej) => { 
                        audio.onended = () => { URL.revokeObjectURL(audioUrl); res(); };
                        audio.onerror = () => rej(new Error('音軌解碼失敗')); 
                        audio.play().catch(e => rej(new Error('瀏覽器阻擋自動播放'))); 
                    });
                }
            } catch (e) { 
                showToast(`語音播放失敗: ${e.message}`, 'error'); 
            } finally { 
                btn.innerHTML = orig; btn.disabled = false; 
            }
        };

        function exportToWord(type) {
            const out = document.getElementById('ai-assistant-output').value; 
            if (!out) return showToast('無內容可匯出', 'warning');
            const html = `<html xmlns:w='urn:schemas-microsoft-com:office:word'><head><meta charset='utf-8'></head><body><h2>AI 分析報告</h2><pre>${out}</pre></body></html>`; 
            const b = new Blob(['\ufeff', html], { type: 'application/msword' }); 
            const l = document.createElement('a'); 
            l.href = URL.createObjectURL(b); l.download = `AI_Report_${Date.now()}.doc`; 
            l.click();
        }

        function exportToSRT() {
            const t = document.getElementById('stt-source-text').value; 
            if (!t || t.includes('【錯誤】')) return;
            const b = new Blob([t], { type: 'text/plain' }); 
            const l = document.createElement('a'); 
            l.href = URL.createObjectURL(b); l.download = `Subtitle_${Date.now()}.srt`; 
            l.click();
        }
    </script>
